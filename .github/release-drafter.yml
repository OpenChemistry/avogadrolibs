name-template: 'Avogadro $RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
categories:
  - title: '✨ Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '👁 Accessibility Improvements'
    labels:
      'accessibility'
  - title: '🐛 Bug Fixes'
    labels:
      - 'crash'
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🚀 Performance Improvements'
    labels:
      - 'speed'
  - title: '🤖 Automation Improvements'
    labels:
      - 'automation'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'build'
  - title: '📚 Translations'
    labels:
      - 'i18n'
autolabeler:
  - label: 'build'
    branch:
      - '/build\/.+/'
    title:
      - '/build/i'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
  - label: 'i18n'
    branch:
      - '/weblate\/.+/'
    title:
      - '/Hosted Weblate/i'
  - label: 'i18n'
    title:
      - '/Automated translation updates/i'
exclude-labels:
  - 'dependencies'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'patch'
  default: minor
template: |
  ## Changes

  $CHANGES

  ## Credits

  Thanks to many contributors, including: $CONTRIBUTORS
