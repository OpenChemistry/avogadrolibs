name: Linux ARM64 Build Matrix
# Many thanks to Cristian Adam for examples
# e.g. https://github.com/cristianadam/HelloWorld/blob/master/.github/workflows/build_cmake.yml
# https://cristianadam.eu/20191222/using-github-actions-with-c-plus-plus-and-cmake/

on:
  push:
    # Bot branches get built by their pull_request event; building the push
    # too just doubles the jobs. The tags line is required: with only a
    # branch filter, tag pushes (release builds) would stop triggering.
    branches-ignore:
      - 'dependabot/**'
      - 'update-i18n-templates'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.8.3
  FEATURES: -DBUILD_GPL_PLUGINS=ON -DBUILD_MOLEQUEUE=OFF -DWITH_COORDGEN=OFF -DQT_VERSION=6

# Never cancel a master run: a cancelled run never saves its compiler cache,
# and the slowest jobs, which gain the most from the cache, are exactly the
# ones a following merge would cancel. The group still allows only one running
# and one pending master run, so master runs queue one after another instead
# of stacking up, and release-asset uploads never overlap. PRs and other
# branches keep cancelling superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        # sccache: true turns on the compiler cache for an entry.
        # sccache_size: the Debug build's objects are much larger than a
        # Release build's; read the real size from `sccache --show-stats` on
        # master and tune it.
        config:
        - {
            name: "Ubuntu ARM", artifact: "",
            os: ubuntu-24.04-arm,
            cc: "gcc", cxx: "g++",
            build_type: "Debug",
            cmake_flags: "-G Ninja -DUSE_SYSTEM_EIGEN=TRUE",
            sccache: true, sccache_size: "1000M",
          }
        - {
            name: "AppImage ARM", artifact: "Avogadro2-arm64.AppImage",
            os: ubuntu-24.04-arm,
            cc: "gcc", cxx: "g++",
            build_type: "Release",
            cmake_flags: "-G Ninja -DINSTALL_BUNDLE_FILES=ON",
            sccache: true,
          }

    steps:
    - name: Checkout workflow repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Checkout Repositories
      uses: ./.github/actions/checkout-repositories

    - name: Install Dependencies
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install ninja-build libeigen3-dev libboost-all-dev libglew-dev libxml2-dev zlib1g-dev libbz2-dev liblzma-dev libzstd-dev
        sudo apt-get -qq install libfuse2

    - name: Install Qt
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        cache: true
        version: ${{ env.QT_VERSION }}

    # Must run before Configure: it exports the compiler-launcher variables
    # that the superbuild's subprojects read when they configure.
    - name: Restore compiler cache
      if: matrix.config.sccache
      uses: ./.github/actions/compiler-cache
      with:
        mode: restore
        name: ${{ matrix.config.name }}
        size: ${{ matrix.config.sccache_size || '600M' }}

    - name: Configure
      run: |
        if [ ! -d "${{ runner.workspace }}/build" ]; then mkdir "${{ runner.workspace }}/build"; fi
        cd "${{ runner.workspace }}/build"
        CC=${{matrix.config.cc}} CXX=${{matrix.config.cxx}} cmake $GITHUB_WORKSPACE/openchemistry ${{env.FEATURES}} ${{ startsWith(github.ref, 'refs/tags/') && '-DAVOGADRO_RELEASE_BUILD=ON' || '' }} -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} ${{matrix.config.cmake_flags}}
      shell: bash

    - name: Build
      run: |
        CC=${{matrix.config.cc}} CXX=${{matrix.config.cxx}} cmake --build . --config ${{matrix.config.build_type}} ${{matrix.config.build_flags}}
      shell: bash
      working-directory: ${{ runner.workspace }}/build

    - name: Run tests
      if: (matrix.config.build_type != 'Release')
      shell: cmake -P {0}
      run: |
        include(ProcessorCount)
        ProcessorCount(N)
        set(ENV{CTEST_OUTPUT_ON_FAILURE} "ON")
        set(ENV{ASAN_OPTIONS} "new_delete_type_mismatch=0")
        execute_process(
          COMMAND ctest -j ${N}
          WORKING_DIRECTORY ${{ runner.workspace }}/build/avogadrolibs
          RESULT_VARIABLE result
        )
        if (NOT result EQUAL 0)
          message(FATAL_ERROR "Running tests failed!")
        endif()

    # !cancelled() lets the action run after a failed build or failed tests.
    # The action prints its statistics on every run and saves only on master,
    # failures included: sccache entries are content-addressed, so a partial
    # cache is still correct.
    - name: Save compiler cache
      if: matrix.config.sccache && !cancelled()
      uses: ./.github/actions/compiler-cache
      with:
        mode: save
        name: ${{ matrix.config.name }}
        size: ${{ matrix.config.sccache_size || '600M' }}

    - name: Package AppImage
      if: matrix.config.name == 'AppImage ARM'
      shell: bash
      run: |
        mkdir appdir
        mv prefix appdir/usr

        export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:appdir/usr/lib

        wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage"
        wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage"
        wget -c -nv "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage"
        chmod a+x *.AppImage

        # get pixi
        # wget -c -nv "https://github.com/prefix-dev/pixi/releases/latest/download/pixi-aarch64-unknown-linux-musl"
        # mv pixi-aarch64-unknown-linux-musl appdir/usr/bin/pixi

        ./linuxdeploy-aarch64.AppImage -d appdir/usr/share/applications/*.desktop --plugin qt --library /usr/lib/aarch64-linux-gnu/libssl.so.3 --library /usr/lib/aarch64-linux-gnu/libcrypto.so.3 --appdir appdir
        # add the custom AppRun
        rm appdir/AppRun
        cp ../avogadrolibs/openchemistry/avogadrolibs/scripts/AppImage.sh appdir/AppRun
        chmod a+x appdir/AppRun
        ./appimagetool-aarch64.AppImage appdir
        mv Avogadro*.AppImage avogadroapp/Avogadro2-aarch64.AppImage # for upload
      working-directory: ${{ runner.workspace }}/build

    - name: Upload
      if: matrix.config.artifact != 0
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ runner.workspace }}/build/avogadroapp/Avogadro2*.*
        name: ${{ matrix.config.artifact }}

    - name: Upload release assets
      if: matrix.config.artifact != 0 && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')
      uses: ./.github/actions/upload-release
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        artifacts: "${{ runner.workspace }}/build/avogadroapp/Avogadro2*.*"

    - name: Setup tmate session
      if: ${{ failure() }}
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
      timeout-minutes: 60
