name: Mac Build Matrix
# Many thanks to Cristian Adam for examples
# e.g. https://github.com/cristianadam/HelloWorld/blob/master/.github/workflows/build_cmake.yml
# https://cristianadam.eu/20191222/using-github-actions-with-c-plus-plus-and-cmake/

on:
  push:
    # Bot branches get built by their pull_request event; building the push
    # too just doubles the jobs. The tags line is required: with only a
    # branch filter, tag pushes (release builds) would stop triggering.
    branches-ignore:
      - 'dependabot/**'
      - 'update-i18n-templates'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.10.1
  # this is different from MACOSX_DEPLOYMENT_TARGET to prevent build problems
  # we set MACOSX_DEPLOYMENT_TARGET later
  MACOS_TARGET: 14
  FEATURES: -DBUILD_GPL_PLUGINS=ON -DBUILD_MOLEQUEUE=OFF -DWITH_COORDGEN=OFF -DQT_VERSION=6 -DUSE_YAEHMOP=ON

# Never cancel a master run: a cancelled run never saves its compiler cache,
# and the slowest jobs, which gain the most from the cache, are exactly the
# ones a following merge would cancel. The group still allows only one running
# and one pending master run, so master runs queue one after another instead
# of stacking up, and release-asset uploads never overlap. PRs and other
# branches keep cancelling superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "macOS Qt6 ARM", artifact: "macOS-arm64",
            os: macos-15,
            cc: "clang", cxx: "clang++",
            build_type: "Release",
            cmake_flags: "-G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64",
            sccache: true,
          }

    steps: &build-steps
    - name: Checkout workflow repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Checkout Repositories
      uses: ./.github/actions/checkout-repositories

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install eigen glew xz pixi create-dmg

    - name: Install Qt
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: ${{ env.QT_VERSION }}

    - name: Grab cache files
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.workspace }}/build/Downloads
        key: ${{ matrix.config.name }}-downloads

    # Must run before Configure: it exports the compiler-launcher variables
    # that the superbuild's subprojects read when they configure.
    - name: Restore compiler cache
      if: matrix.config.sccache
      uses: ./.github/actions/compiler-cache
      with:
        mode: restore
        name: ${{ matrix.config.name }}
        size: ${{ matrix.config.sccache_size || '600M' }}

    - name: Configure
      run: |
        if [ ! -d "${{ runner.workspace }}/build" ]; then mkdir "${{ runner.workspace }}/build"; fi
        cd "${{ runner.workspace }}/build"
        # won't have any effect except on Mac
        echo "MACOSX_DEPLOYMENT_TARGET=${{ env.MACOS_TARGET }}" >> $GITHUB_ENV
        CC=${{matrix.config.cc}} CXX=${{matrix.config.cxx}} cmake $GITHUB_WORKSPACE/openchemistry ${{env.FEATURES}} ${{ startsWith(github.ref, 'refs/tags/') && '-DAVOGADRO_RELEASE_BUILD=ON' || '' }} -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} ${{matrix.config.cmake_flags}}
      shell: bash

    - name: Build
      run: |
        CC=${{matrix.config.cc}} CXX=${{matrix.config.cxx}} cmake --build . --config ${{matrix.config.build_type}} ${{matrix.config.build_flags}}
      shell: bash
      working-directory: ${{ runner.workspace }}/build

    # This job has no test step, so the cache is saved right after the build.
    # !cancelled() lets the action run after a failed build. The action prints
    # its statistics on every run and saves only on master, failures
    # included: sccache entries are content-addressed, so a partial cache is
    # still correct.
    - name: Save compiler cache
      if: matrix.config.sccache && !cancelled()
      uses: ./.github/actions/compiler-cache
      with:
        mode: save
        name: ${{ matrix.config.name }}
        size: ${{ matrix.config.sccache_size || '600M' }}

    - name: Fix Mac plugins
      if: runner.os == 'macOS'
      working-directory: ${{ runner.workspace }}/build/prefix/lib/openbabel
      run: |
        for plugin in *.so; do
          for libpath in `otool -L ${plugin} | grep '/Users/runner/work' | awk '{print $1}'`; do
            export lib=`echo $libpath | cut -d '/' -f 9`;
            echo "Fixing $plugin $lib $libpath"
            install_name_tool -change $libpath @executable_path/../Frameworks/$lib $plugin
          done
        done
        cd .. # build/prefix/lib
        for plugin in libinchi.*.dylib libopenbabel.*.dylib; do
          for libpath in `otool -L ${plugin} | grep '/Users/runner/work' | awk '{print $1}'`; do
            export lib=`echo $libpath | cut -d '/' -f 9`;
            echo "Fixing $plugin $lib $libpath"
            install_name_tool -change $libpath @executable_path/../Frameworks/$lib $plugin
          done
        done
        otool -L libinchi.*.dylib
        otool -L libopenbabel.*.dylib
        # cp -p libinchi* ../Avogadro2.app/Contents/Frameworks/
        # cp -p libopenbabel* ../Avogadro2.app/Contents/Frameworks/
        # finally, fixup the binaries
        cd ../bin
        for exe in obabel obmm eht_bind genXrdPattern; do
          for libpath in `otool -L ${exe} | grep '/Users/runner/work' | awk '{print $1}'`; do
            export lib=`echo $libpath | cut -d '/' -f 9`;
            echo "Fixing $exe $lib $libpath"
            install_name_tool -change $libpath @executable_path/../Frameworks/$lib $exe
          done
        done
        ls .. # build/prefix

    - name: Install the Apple certificate
      # From GitHub docs: https://docs.github.com/en/actions/guides/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      if: runner.os == 'macOS'
      working-directory: ${{ runner.workspace }}/build
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        NOTARIZE_USERNAME: ${{ secrets.AC_USERNAME }}
        NOTARIZE_PASSWORD: ${{ secrets.AC_PASSWORD }}
        CODESIGN_IDENTITY: ${{ secrets.CODESIGN_ID }}
        PRODUCT_BUNDLE_IDENTIFIER: cc.avogadro
      run: |
        # create variables
        if [ -n "${P12_PASSWORD}" ]; then
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -d -o $CERTIFICATE_PATH

          # create temporary keychain if the cert is non-zero
          if [ -s $CERTIFICATE_PATH ]; then
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            # import the certificate *and* its private key to the keychain
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            # let codesign use the private key without an interactive prompt
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH > /dev/null
            security list-keychain -d user -s $KEYCHAIN_PATH

            # Fail here, with a useful message, rather than deep inside the
            # packaging step where the only clue is
            # "The specified item could not be found in the keychain."
            echo "Code signing identities in the build keychain:"
            security find-identity -v -p codesigning $KEYCHAIN_PATH || true
            if ! security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -qF "${CODESIGN_IDENTITY}"; then
              echo "::error::No valid codesigning identity matching CODESIGN_ID was found."
              echo "BUILD_CERTIFICATE_BASE64 must be a .p12 exported from Keychain Access"
              echo "under 'My Certificates' (i.e. the certificate *and* its private key),"
              echo "and the certificate must not have expired."
              exit 1
            fi
          fi # certificate exists
        fi # password exists

    - name: Create Mac Packages
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        exe_path=prefix/Avogadro2.app/Contents/MacOS/
        args=""
        cp -p `which pixi` ${exe_path}
        for exe in ${exe_path}*; do
          args="${args} -executable=${exe}"
        done;
        macdeployqt prefix/Avogadro2.app ${args} -libpath=prefix/lib -always-overwrite

        # Remove CI-only absolute RPATH entries and ensure each Mach-O has
        # bundle-relative lookup paths for frameworks and private libraries.
        app_path=prefix/Avogadro2.app
        find "${app_path}/Contents" -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -print0 | \
        while IFS= read -r -d '' binary; do
          if ! file "${binary}" | grep -q "Mach-O"; then
            continue
          fi

          # Remove absolute RPATH entries from CI build/install roots.
          while IFS= read -r rpath; do
            if [[ -n "${rpath}" && "${rpath}" == /Users/runner/* ]]; then
              echo "Deleting RPATH ${rpath} in ${binary}"
              install_name_tool -delete_rpath "${rpath}" "${binary}" || true
            fi
            if [[ -n "${rpath}" && "${rpath}" == /home/runner/* ]]; then
              echo "Deleting RPATH ${rpath} in ${binary}"
              install_name_tool -delete_rpath "${rpath}" "${binary}" || true
            fi
            if [[ -n "${rpath}" && "${rpath}" == /opt/hostedtoolcache/* ]]; then
              echo "Deleting RPATH ${rpath} in ${binary}"
              install_name_tool -delete_rpath "${rpath}" "${binary}" || true
            fi
          done < <(otool -l "${binary}" | awk '/LC_RPATH/{getline; getline; if ($1 == "path") print $2}')

          # Add bundle-relative RPATH entries (duplicates are ignored).
          install_name_tool -add_rpath "@executable_path/../Frameworks" "${binary}" 2>/dev/null || true
          install_name_tool -add_rpath "@executable_path/../lib" "${binary}" 2>/dev/null || true
          install_name_tool -add_rpath "@loader_path/../Frameworks" "${binary}" 2>/dev/null || true
          install_name_tool -add_rpath "@loader_path/../lib" "${binary}" 2>/dev/null || true
          install_name_tool -add_rpath "@loader_path/../../Frameworks" "${binary}" 2>/dev/null || true
          install_name_tool -add_rpath "@loader_path/../../lib" "${binary}" 2>/dev/null || true
        done

        # Ensure any remaining absolute CI paths in linked libraries are switched
        # to @rpath-based references.
        find "${app_path}/Contents" -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -print0 | \
        while IFS= read -r -d '' binary; do
          if ! file "${binary}" | grep -q "Mach-O"; then
            continue
          fi

          while IFS= read -r dep; do
            case "${dep}" in
              /Users/runner/*|/home/runner/*|/opt/hostedtoolcache/*) ;;
              *) continue ;;
            esac
            if [[ "${dep}" == *".framework/"* ]]; then
              rel_path="$(echo "${dep}" | sed -E 's|^.*([^/]+\.framework/Versions/[^/]+/[^/]+)$|\1|')"
              if [[ -n "${rel_path}" && "${rel_path}" != "${dep}" ]]; then
                new_dep="@rpath/${rel_path}"
              else
                new_dep="@rpath/$(basename "${dep}")"
              fi
            else
              new_dep="@rpath/$(basename "${dep}")"
            fi
            echo "Rewriting ${binary}: ${dep} -> ${new_dep}"
            install_name_tool -change "${dep}" "${new_dep}" "${binary}" || true
          done < <(otool -L "${binary}" | awk '/^\t\// {print $1}')
        done

        if [ -n "${P12_PASSWORD}" ]; then
          # codesign the Open Babel modules, then the app
          /usr/bin/codesign -s "${CODESIGN_IDENTITY}" -f --timestamp --deep --options runtime --entitlements ../${{ github.event.repository.name }}/openchemistry/avogadroapp/cmake/Entitlements.plist prefix/Avogadro2.app/Contents/lib/openbabel/*.so
          /usr/bin/codesign -s "${CODESIGN_IDENTITY}" -f --timestamp --deep --options runtime --entitlements ../${{ github.event.repository.name }}/openchemistry/avogadroapp/cmake/Entitlements.plist prefix/Avogadro2.app
        fi
        # create the DMG
        cd prefix
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # This is a tag - extract version
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present
          VOLNAME="Avogadro2 ${VERSION}"
          IS_RELEASE=true
        else
          # This is a nightly build - no version
          # but include the date in the volume name
          VERSION=""
          VOLNAME="Avogadro2 $(date +%Y-%m-%d)"
          IS_RELEASE=false
        fi

        # Determine architecture
        ARCH=$(uname -m)

        # Build DMG filename
        if [[ "$IS_RELEASE" == true ]]; then
          if [[ "$ARCH" == "arm64" ]]; then
            DMG_NAME="Avogadro2-${VERSION}-Darwin-arm64.dmg"
          else
            DMG_NAME="Avogadro2-${VERSION}-Darwin.dmg"
          fi
        else
          if [[ "$ARCH" == "arm64" ]]; then
            DMG_NAME="Avogadro2-continuous-arm64.dmg"
          else
            DMG_NAME="Avogadro2-continuous.dmg"
          fi
        fi
        # Notarize the app bundle first, so the stapled ticket
        # is preserved when users copy the app out of the DMG
        if [ -n "${P12_PASSWORD}" ]; then
          echo "Creating ZIP for app notarization"
          ditto -c -k --keepParent Avogadro2.app Avogadro2.zip
          echo "Submitting app for notarization"
          xcrun notarytool submit Avogadro2.zip --apple-id "$NOTARIZE_USERNAME" --team-id "$NOTARIZE_TEAM" --password "$NOTARIZE_PASSWORD" --verbose --wait
          echo "Stapling app bundle"
          xcrun stapler staple -v Avogadro2.app
          rm Avogadro2.zip
        fi

        echo "Building DMG: ${DMG_NAME}"
        create-dmg --volname "${VOLNAME}" --icon-size 64 --filesystem "APFS" --format "ULMO" --no-internet-enable --icon "Avogadro2.app" 20 64 --app-drop-link 200 64 ${DMG_NAME} Avogadro2.app
        mv ${DMG_NAME} ../${DMG_NAME}
        cd ..
        if [ -n "${P12_PASSWORD}" ]; then
          echo "Submitting DMG: ${DMG_NAME}"
          xcrun notarytool submit ${DMG_NAME} --apple-id "$NOTARIZE_USERNAME" --team-id "$NOTARIZE_TEAM" --password "$NOTARIZE_PASSWORD" --verbose --wait
          echo "Stapling notarized DMG: ${DMG_NAME}"
          xcrun stapler staple -v ${DMG_NAME}
        fi
      working-directory: ${{ runner.workspace }}/build/
      continue-on-error: true
      env:
        NOTARIZE_TEAM: ${{ secrets.AC_TEAM }}
        NOTARIZE_USERNAME: ${{ secrets.AC_USERNAME }}
        NOTARIZE_PASSWORD: ${{ secrets.AC_PASSWORD }}
        CODESIGN_IDENTITY: ${{ secrets.CODESIGN_ID }}
        PRODUCT_BUNDLE_IDENTIFIER: cc.avogadro
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    - name: Upload
      if: matrix.config.artifact != 0
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ runner.workspace }}/build/Avogadro2*.*
        name: ${{ matrix.config.artifact }}

    - name: Upload release assets
      uses: ./.github/actions/upload-release
      if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        artifacts: "${{ runner.workspace }}/build/Avogadro2*.dmg"

    - name: Setup tmate session
      if: ${{ failure() }}
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
      timeout-minutes: 60

  # Intel macOS runs only off PRs: macos-15-intel runners are the slowest
  # option and macOS runner capacity is scarce and shared org-wide, and
  # GitHub is retiring Intel macOS images. Label a PR full-ci and push to it
  # to include this job; fork push builds still run it, since a fork push is
  # not a pull_request event here. The steps are shared with "build" through
  # the &build-steps/*build-steps YAML anchor, so edit them there, not here.
  intel:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "macOS Qt6 Intel", artifact: "macOS-intel",
            os: macos-15-intel,
            cc: "clang", cxx: "clang++",
            build_type: "Release",
            cmake_flags: "-G Ninja -DCMAKE_OSX_ARCHITECTURES=x86_64",
            sccache: true,
          }

    steps: *build-steps
