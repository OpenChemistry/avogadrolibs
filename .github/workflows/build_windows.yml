name: Windows Build
# Many thanks to Cristian Adam for examples
# e.g. https://github.com/cristianadam/HelloWorld/blob/master/.github/workflows/build_cmake.yml
# https://cristianadam.eu/20191222/using-github-actions-with-c-plus-plus-and-cmake/

# This workflow will build and (optionally) sign releases for Windows
# .. since SignPath requires only a Windows build in the action
# .. to successfully sign

on: [push, pull_request, workflow_dispatch]

env:
  QT_VERSION: 6.8.3
  FEATURES: -DBUILD_GPL_PLUGINS=ON -DWITH_COORDGEN=OFF -DQT_VERSION=6 -DUSE_3DCONNEXION=OFF -DBUILD_MOLEQUEUE=OFF

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows Qt6", artifact: "Win64.exe",
            os: windows-latest,
            cc: "cl", cxx: "cl",
            build_type: "Release",
            cmake_flags: "-G Ninja -DCMAKE_TOOLCHAIN_FILE=/c/vcpkg/scripts/buildsystems/vcpkg.cmake -DUSE_SYSTEM_EIGEN=ON -DUSE_SYSTEM_LIBARCHIVE=ON -DUSE_SYSTEM_LIBXML2=ON -DUSE_SYSTEM_ZLIB=ON",
            build_flags: "--parallel",
            package: "Avogadro2",
            sentry: false,
          }
        - {
            name: "Windows Tests", artifact: "",
            os: windows-latest,
            cc: "cl", cxx: "cl",
            build_type: "Release",
            test: true,
            cmake_flags: "-G Ninja -DCMAKE_TOOLCHAIN_FILE=/c/vcpkg/scripts/buildsystems/vcpkg.cmake -DUSE_SYSTEM_EIGEN=ON -DUSE_SYSTEM_LIBARCHIVE=ON -DUSE_SYSTEM_LIBXML2=ON -DUSE_SYSTEM_ZLIB=ON",
            build_flags: "--parallel",
            package: "Avogadro2",
            sentry: false,
          }
        # The same tests under MSVC's AddressSanitizer. Windows is where the
        # crash reports come from, and ASan is the only sanitizer this
        # toolchain has -- TSan, MSan and LSan are Linux-only, so this finds
        # the heap-layout and uninitialized-stack differences that make the
        # same undefined behaviour crash here and not there. The flags live in
        # cmake/CompilerFlags.cmake under the MSVC branch, and the "Run tests"
        # step below switches them on for avogadrolibs only -- see the comment
        # there for why the superbuild cannot be built in that configuration.
        - {
            name: "Windows Address Sanitizer", artifact: "",
            os: windows-latest,
            cc: "cl", cxx: "cl",
            build_type: "RelWithDebInfo",
            test: true,
            asan: true,
            cmake_flags: "-G Ninja -DCMAKE_TOOLCHAIN_FILE=/c/vcpkg/scripts/buildsystems/vcpkg.cmake -DUSE_SYSTEM_EIGEN=ON -DUSE_SYSTEM_LIBARCHIVE=ON -DUSE_SYSTEM_LIBXML2=ON -DUSE_SYSTEM_ZLIB=ON",
            build_flags: "--parallel",
            package: "Avogadro2",
            sentry: false,
          }
        # Diagnostic build with Sentry crash reporting compiled in. Ships as a
        # separate installer that installs beside a release install; the
        # release build above gets no crash reporting.
        # RelWithDebInfo rather than Release: MSVC Release passes no /Zi, so it
        # emits no PDBs and every frame would come back as a raw address.
        - {
            name: "Windows Qt6 (Sentry)", artifact: "Win64-diagnostic.exe",
            os: windows-latest,
            cc: "cl", cxx: "cl",
            build_type: "RelWithDebInfo",
            cmake_flags: "-G Ninja -DCMAKE_TOOLCHAIN_FILE=/c/vcpkg/scripts/buildsystems/vcpkg.cmake -DUSE_SYSTEM_EIGEN=ON -DUSE_SYSTEM_LIBARCHIVE=ON -DUSE_SYSTEM_LIBXML2=ON -DUSE_SYSTEM_ZLIB=ON",
            build_flags: "--parallel",
            package: "Avogadro2-Diagnostic",
            sentry: true,
          }

    steps:
    - name: Checkout workflow repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Checkout Repositories
      uses: ./.github/actions/checkout-repositories

    - name: Install Qt
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        cache: true
        version: ${{ env.QT_VERSION }}

    - name: Configure MSVC Command Prompt
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    # Update + re-bootstrap vcpkg, and emit a vcpkg_version output
    - name: Ensure vcpkg is up to date
      if: runner.os == 'Windows'
      id: vcpkg_version
      uses: ./.github/actions/update-vcpkg

    # Restore vcpkg cache (use manifest lock if available)
    - name: Restore vcpkg cache
      if: runner.os == 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          C:\vcpkg\installed
          C:\vcpkg\packages
          C:\vcpkg\downloads
        # We don't use a vcpkg manifest so we'll use the vcpkg git SHA as the cache key
        # Fallback to vcpkg git SHA so cache is somewhat stable across runs.
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg_version.outputs.sha || 'no-vcpkgjson' }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ runner.arch }}-
      env:
        VCPKG_ROOT: C:\vcpkg

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install nsis ninja
        vcpkg install libarchive eigen3 libxml2 zlib gtest
      shell: bash

    - name: Configure
      run: |
        if [ ! -d "${{ runner.workspace }}/build" ]; then mkdir "${{ runner.workspace }}/build"; fi
        cd "${{ runner.workspace }}/build"
        SENTRY_ARGS=""
        if [ "${USE_SENTRY}" = "true" ]; then
          # An unset SENTRY_DSN secret is fine: the build then reports itself
          # as unavailable at runtime rather than failing to configure.
          SENTRY_ARGS="-DUSE_SENTRY=ON -DSENTRY_DSN=${SENTRY_DSN} -DSENTRY_ENVIRONMENT=nightly"
        fi
        CC=${{matrix.config.cc}} CXX=${{matrix.config.cxx}} cmake $GITHUB_WORKSPACE/openchemistry ${{env.FEATURES}} -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} ${{matrix.config.cmake_flags}} $SENTRY_ARGS
      shell: bash
      env:
        USE_SENTRY: ${{ matrix.config.sentry }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    # Cache thirdparty builds (OpenBabel, etc.)
    - name: Cache thirdparty
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.workspace }}/build/Downloads
        key: thirdparty-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config.build_type }}-sentry${{ matrix.config.sentry }}-${{ hashFiles('openchemistry/cmake/External*.cmake', 'openchemistry/cmake/projects/*.cmake') }}

    - name: Build
      run: |
        CC=${{matrix.config.cc}} CXX=${{matrix.config.cxx}} cmake --build . --config ${{matrix.config.build_type}} ${{matrix.config.build_flags}}
      shell: bash
      working-directory: ${{ runner.workspace }}/build

    - name: Run tests
      if: (matrix.config.test == true)
      shell: bash
      run: |
        cd "${{ runner.workspace }}/build/avogadrolibs"
        if [ "${{ matrix.config.asan }}" = "true" ]; then
          # AddressSanitizer goes on here, for avogadrolibs alone, rather than
          # by building the whole superbuild in an "asan" configuration the way
          # the Linux job does. A configuration name MSVC does not recognise
          # leaves CMAKE_CXX_FLAGS_<CONFIG> empty for every subproject that
          # does not define one, and under CMP0091 OLD -- which is where Open
          # Babel sits -- that is exactly where its /MD comes from. cl then
          # falls back to the static CRT and Open Babel fails to link against
          # its own DLL with a wall of LNK2005. avogadrolibs requires CMake
          # 3.24, so CMP0091 is NEW for it and CMAKE_MSVC_RUNTIME_LIBRARY still
          # yields /MD whatever the configuration is called.
          #
          # Instrumenting only our own code is what we wanted in any case: Qt
          # and Open Babel stay uninstrumented, which is why the container
          # annotations are disabled in cmake/CompilerFlags.cmake.
          #
          # Imported targets (e.g. vcpkg's find_package(GLEW CONFIG) result)
          # know nothing of an "asan" configuration, so without a mapping
          # CMake falls back to whichever configuration the target lists
          # first -- the Debug build for vcpkg packages, whose DLLs are not
          # on the PATH set up below. The test process then never starts and
          # ctest just waits out its timeout with no output.
          # CMAKE_MAP_IMPORTED_CONFIG_ASAN maps our "asan" configuration onto
          # the release variants first; the empty entry is the
          # configuration-less IMPORTED_LOCATION, and Debug stays in the list,
          # last, because a mapped target that provides none of the listed
          # configurations is treated as not found.
          cmake -DENABLE_TESTING=ON -DCMAKE_BUILD_TYPE=asan \
            -DCMAKE_MAP_IMPORTED_CONFIG_ASAN="RelWithDebInfo;Release;MinSizeRel;;Debug" .
        else
          # just turn on tests for
          cmake -DENABLE_TESTING=ON .
        fi
        cmake --build .
        # Add DLL directories to PATH so tests can find dependencies
        export PATH="${QT_ROOT_DIR}/bin:/c/vcpkg/installed/x64-windows/bin:${{ runner.workspace }}/build/prefix/bin:$PATH"

        if [ "${{ matrix.config.asan }}" = "true" ]; then
          # windows_hook_rtl_allocators catches buffers that came from the
          # Win32 heap APIs rather than from the CRT, which is most of what Qt
          # hands us. There is no detect_leaks here: LeakSanitizer does not
          # exist on Windows, so leaks stay the Linux job's business.
          export ASAN_OPTIONS="windows_hook_rtl_allocators=true:print_stats=1"
          # The ASan runtime DLL sits in the MSVC toolset's bin directory,
          # which msvc-dev-cmd has already put on PATH. Say so in the log,
          # because a missing one shows up as every test failing to start.
          echo "ASan runtime: $(command -v clang_rt.asan_dynamic-x86_64.dll || echo 'not on PATH')"
        fi

        ctest --output-on-failure

    # The crashpad binaries reach the prefix through crashpad's own install
    # rules, which sentry-native does not drive directly when building shared.
    # If they go missing the application still starts and simply never reports
    # a crash, so fail here rather than shipping that.
    - name: Verify crash handler binaries
      if: matrix.config.sentry
      shell: bash
      working-directory: ${{ runner.workspace }}/build
      run: |
        status=0
        for binary in avogadro2.exe sentry.dll crashpad_handler.exe crashpad_wer.dll; do
          if [ -f "prefix/bin/$binary" ]; then
            echo "found    prefix/bin/$binary"
          else
            echo "MISSING  prefix/bin/$binary"
            status=1
          fi
        done
        echo "--- debug symbols found ---"
        find . -name '*.pdb' -not -path './Downloads/*' | head -40
        exit $status

    # Runs before packaging, which moves prefix/ out from under us. Sentry
    # matches minidumps to symbols by debug ID, so this does not have to agree
    # with the release name the application reports. Both avogadrolibs and
    # avogadroapp symbols are needed: crashes usually land in a plugin or in
    # Avogadro::Rendering rather than in avogadro2.exe itself.
    - name: Upload debug symbols
      if: matrix.config.sentry
      shell: bash
      working-directory: ${{ runner.workspace }}/build
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        # Pinned rather than "latest", to match how this workflow pins every
        # action to a SHA. The checksum is of the released Windows binary.
        SENTRY_CLI_VERSION: "3.6.2"
        SENTRY_CLI_SHA256: "5c90cb0045cef3d3c36113c2aa21a7dcae11627d2d6e3098b679dea5b6681be3"
      run: |
        if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
          echo "SENTRY_AUTH_TOKEN is not set - skipping debug symbol upload."
          echo "The diagnostic build is still produced; crashes just will not"
          echo "symbolicate until the secret is configured."
          exit 0
        fi
        curl -sSfL -o sentry-cli.exe \
          "https://downloads.sentry-cdn.com/sentry-cli/${SENTRY_CLI_VERSION}/sentry-cli-Windows-x86_64.exe"
        echo "${SENTRY_CLI_SHA256}  sentry-cli.exe" | sha256sum --check --strict
        ./sentry-cli.exe debug-files upload --include-sources \
          avogadroapp avogadrolibs prefix/bin

    - name: Create Windows Packages
      if: matrix.config.artifact != 0
      shell: bash
      run: |
        gh release download -R prefix-dev/pixi -p "pixi-x86_64-pc-windows-msvc.exe"
        # wget https://github.com/prefix-dev/pixi/releases/latest/download/pixi-x86_64-pc-windows-msvc.exe
        # move pixi to prefix/bin
        mv pixi-x86_64-pc-windows-msvc.exe prefix/bin/pixi.exe
        # run windeployqt
        windeployqt --release prefix/bin/avogadro2.exe
        # Copy Qt DLLs that windeployqt misses (used by plugins and JKQTPlotter)
        cp "${QT_ROOT_DIR}/bin/Qt6Concurrent.dll" prefix/bin/
        cp "${QT_ROOT_DIR}/bin/Qt6PrintSupport.dll" prefix/bin/
        cp "${QT_ROOT_DIR}/bin/Qt6Xml.dll" prefix/bin/
        mv prefix avogadro2
        # 7z a Avogadro2-windows.zip avogadro2
        cd avogadro2
        # create NSIS
        /c/Program\ Files\ \(x86\)/NSIS/makensis avogadro2.nsi
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # This is a tag - extract version
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present
        else
          # This is a nightly build - use current date
          VERSION="continuous"
        fi

        # NSIS OutFile is "<package>-Setup.exe", set from NSIS_OUTFILE in
        # avogadroapp/avogadro/CMakeLists.txt, so these two names have to stay
        # in step.
        mv ${{matrix.config.package}}-Setup.exe ../${{matrix.config.package}}-${VERSION}-win64.exe
      working-directory: ${{ runner.workspace }}/build/
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Upload
      if: matrix.config.artifact != 0
      id: upload-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ runner.workspace }}/build/Avogadro2*.*
        name: ${{ matrix.config.artifact }}

    - name: Upload release assets
      if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')
      uses: ./.github/actions/upload-release
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        artifacts: "${{ runner.workspace }}/build/Avogadro2*.*"

    - name: Sign Windows release
      if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')
      uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
      continue-on-error: true
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '${{ secrets.SIGNPATH_ORG_ID }}'
        project-slug: 'avogadrolibs'
        signing-policy-slug: 'release-signing'
        github-artifact-id: '${{ steps.upload-artifact.outputs.artifact-id }}'
        wait-for-completion: false
        output-artifact-directory: '../build/'

    # MSIX is release-only: the diagnostic build installs beside a release
    # install and has no Store identity of its own.
    - name: Create MSIX
      if: ${{ !matrix.config.sentry && github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/') }}
      shell: powershell
      run:
        # create MSIX
        makeappx pack /v /d . /p ../Avogadro2.msix
      working-directory: ${{ runner.workspace }}/build/avogadro2
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Upload MSIX
      if: ${{ !matrix.config.sentry && github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ runner.workspace }}/build/Avogadro2.msix
        name: Avogadro2.msix

    # Only on a run someone started by hand to debug. On an ordinary push this
    # held a runner for the full hour every time a job went red -- it did so on
    # master run 35219140241, where the failure was a one-line upload problem.
    # Start the workflow from the Actions tab when you actually want a shell.
    - name: Setup tmate session
      if: failure() && github.event_name == 'workflow_dispatch'
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
      timeout-minutes: 30
