name: update-i18n-templates

on:
  workflow_dispatch:

  schedule:
    # * is a special character in YAML so you have to quote this string
    # run weekly, every Sunday at 01:23
    - cron:  '23 1 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-i18n:
    name: Update translation templates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install packages
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install gettext

    - name: Run extract-messages
      run: |
        sh scripts/extract-messages.sh

    - name: Create pull request
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: update-i18n-templates
      run: |
        set -euo pipefail

        git add -A i18n/

        # xgettext rewrites the POT-Creation-Date header every run,
        # so ignore diffs where that is the only change
        meaningful=$(git diff --cached -U0 \
          | grep -E '^[+-]' \
          | grep -vE '^(\+\+\+|---) ' \
          | grep -v 'POT-Creation-Date' || true)

        if [ -z "$meaningful" ]; then
          echo "No meaningful translation template changes."
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Deleting stale branch $BRANCH."
            git push origin --delete "$BRANCH"
          fi
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -C "$BRANCH"
        git commit -s -m "Automated translation updates"
        git push --force origin "$BRANCH"

        open_prs=$(gh pr list --head "$BRANCH" --base "$GITHUB_REF_NAME" \
          --state open --json number --jq length)
        if [ "$open_prs" = "0" ]; then
          gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" \
            --title "Automated translation updates" \
            --body "Weekly update of the translation template from scripts/extract-messages.sh." \
            --label i18n
        else
          echo "A pull request is already open; the force-push updated it."
        fi
