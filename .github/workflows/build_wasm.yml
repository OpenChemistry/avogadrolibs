name: WASM Build

on:
  push:
    branches: [master]
    paths:
      - 'avogadro/**'
      - 'cmake/**'
      - 'thirdparty/**'
      - 'utilities/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build_wasm.yml'
  pull_request:
    paths:
      - 'avogadro/**'
      - 'cmake/**'
      - 'thirdparty/**'
      - 'utilities/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build_wasm.yml'
  workflow_dispatch:
    inputs:
      superbuild_revision:
        description: Published OpenChemistry superbuild commit
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  SUPERBUILD_REVISION: ${{ inputs.superbuild_revision || vars.WASM_SUPERBUILD_REVISION }}
  # ExternalProject's nested builds must use the same limit as the superbuild.
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  build:
    if: ${{ vars.WASM_SUPERBUILD_REVISION != '' || inputs.superbuild_revision != '' }}
    name: WebAssembly library profile (${{ matrix.qt_kit }})
    strategy:
      fail-fast: false
      matrix:
        qt_kit: [wasm_multithread, wasm_singlethread]
    env:
      QT_WASM_KIT: ${{ matrix.qt_kit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout pinned superbuild
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenChemistry/openchemistry
          ref: ${{ env.SUPERBUILD_REVISION }}
          path: openchemistry
          persist-credentials: false

      # Upstream-only pins are enabled once the companion PRs land.
      - name: Checkout pinned companion sources
        working-directory: openchemistry
        run: git submodule update --init --recursive

      # With no ref override, pull_request builds GitHub's merge revision,
      # just like the native workflows. Do not build the superbuild's libs pin.
      - name: Checkout library revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openchemistry/avogadrolibs
          persist-credentials: false

      - name: Read the editor's supported toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenChemistry/avogadro-web
          ref: refs/heads/main
          sparse-checkout: tools/wasm-toolchain.json
          sparse-checkout-cone-mode: false
          path: web-toolchain
          persist-credentials: false
      - name: Set toolchain versions
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          versions = json.loads(Path('web-toolchain/tools/wasm-toolchain.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for tool in ('qt', 'emscripten'):
                  version = versions[tool]
                  if not re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+', version):
                      raise SystemExit(f'Invalid version for {tool}')
                  print(f'{tool.upper()}_VERSION={version}', file=out)
          PY
      - name: Install build tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install cmake ninja-build gzip

      # Separate installation roots keep the host and WASM Qt caches distinct.
      - name: Install host Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/qt-host
          # Host tools link QtCore, which needs Qt's matching ICU runtime.
          archives: qtbase icu
          cache: true
          set-env: false

      - name: Verify host Qt tools
        run: |
          qt_host="$RUNNER_TEMP/qt-host/Qt/$QT_VERSION/gcc_64"
          "$qt_host/libexec/uic" --version
          "$qt_host/libexec/moc" --version
          "$qt_host/libexec/rcc" --version

      - name: Install WASM Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: ${{ matrix.qt_kit }}
          dir: ${{ runner.temp }}/qt-wasm
          archives: qtbase
          cache: true
          set-env: false

      - name: Checkout Emscripten SDK installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emscripten-core/emsdk
          ref: ${{ env.EMSCRIPTEN_VERSION }}
          path: emsdk
          persist-credentials: false

      - name: Cache Emscripten SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            emsdk/upstream
            emsdk/node
          key: wasm-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Activate toolchain
        run: |
          ./emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
          {
            echo "EM_CACHE=$RUNNER_TEMP/em-cache"
            echo "QT_HOST_PATH=$RUNNER_TEMP/qt-host/Qt/$QT_VERSION/gcc_64"
            echo "QT_WASM_PATH=$RUNNER_TEMP/qt-wasm/Qt/$QT_VERSION/$QT_WASM_KIT"
          } >> "$GITHUB_ENV"

      - name: Configure
        run: |
          source "$GITHUB_WORKSPACE/emsdk/emsdk_env.sh"
          cmake -S openchemistry -B build-wasm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_WASM_PATH/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQT_CHAINLOAD_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DAVOGADRO_WEB_EDITOR=ON \
            -DBUILD_AVOGADRO=ON -DUSE_OPENGL=ON \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_PLUGINS=ON \
            -DENABLE_SUBPROCESS=OFF -DUSE_PYTHON=OFF \
            -DUSE_LIBARCHIVE=OFF -DUSE_PLOTTER=OFF \
            -DBUILD_MOLEQUEUE=OFF -DAvogadro_ENABLE_RPC=OFF \
            -DENABLE_TESTING=OFF

      - name: Build and install the library profile
        run: |
          source "$GITHUB_WORKSPACE/emsdk/emsdk_env.sh"
          cmake --build build-wasm --parallel 2 --target avogadrolibs
