name: Linux Fuzz Tests

on:
  pull_request:
  schedule:
  - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Seconds to spend on each fuzz target'
        required: false
        default: '60'

env:
  QT_VERSION: 6.8.3
  FEATURES: -DBUILD_GPL_PLUGINS=ON -DBUILD_MOLEQUEUE=OFF -DWITH_COORDGEN=OFF -DQT_VERSION=6
  AVOGADRO_DATA_ROOT: ${{ github.workspace }}/openchemistry/avogadrodata
  # Some QtGui fuzz targets construct widgets, so they need a windowless platform.
  QT_QPA_PLATFORM: offscreen
  # Pull requests get a quick smoke run; the nightly run fuzzes for longer.
  FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '10' || github.event.inputs.fuzz_seconds || '60' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Ubuntu Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout workflow repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Checkout Repositories
      uses: ./.github/actions/checkout-repositories

    - name: Install Dependencies
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install clang ninja-build libeigen3-dev libboost-all-dev libglew-dev libxml2-dev zlib1g-dev libbz2-dev liblzma-dev libzstd-dev

    - name: Install Qt
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        cache: true
        version: ${{ env.QT_VERSION }}

    # Coverage-guided fuzzing is cumulative: units the fuzzer discovers are
    # only useful if they survive to the next run. Restore last night's
    # corpus, fuzz on top of it, then save the merged result below.
    - name: Restore fuzz corpus
      id: corpus-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.workspace }}/fuzz-corpus
        key: fuzz-corpus-${{ github.run_id }}
        restore-keys: |
          fuzz-corpus-

    - name: Configure
      run: |
        if [ ! -d "${{ runner.workspace }}/build" ]; then mkdir "${{ runner.workspace }}/build"; fi
        cd "${{ runner.workspace }}/build"

        # Hardening flags, on top of the sanitizers. _GLIBCXX_ASSERTIONS is the
        # important one here: Core::Array::operator[] forwards to std::vector,
        # so an index past the end but still inside the allocation is invisible
        # to ASan and becomes a hard failure only with the libstdc++ assertions
        # turned on.
        #
        # Note that glibc disables _FORTIFY_SOURCE when __SANITIZE_ADDRESS__ is
        # defined, so it is a no-op in this job -- it is set anyway so the flag
        # list stays the one we want everywhere, and starts working if a
        # non-ASan fuzz configuration is ever added.
        HARDENING="-D_GLIBCXX_ASSERTIONS -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3"
        HARDENING="$HARDENING -fstack-clash-protection -fstack-protector-strong"

        # -fhardened is GCC 14+ only; clang rejects it outright. Probe rather
        # than assume, so this keeps working if the job ever changes compiler.
        if echo 'int main(){return 0;}' | clang++ -fhardened -x c++ - -o /dev/null 2>/dev/null; then
          HARDENING="$HARDENING -fhardened"
          echo "-fhardened is supported, enabling it"
        else
          echo "-fhardened is not supported by this compiler, skipping it"
        fi

        SAN="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"

        CFLAGS="$SAN $HARDENING" \
        CXXFLAGS="$SAN $HARDENING" \
        LDFLAGS="-fsanitize=address,undefined" \
        CC=clang CXX=clang++ cmake -G Ninja $GITHUB_WORKSPACE/openchemistry ${{env.FEATURES}} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTING=ON -DTEST_QTGL=OFF -DENABLE_FUZZ=ON -DUSE_SYSTEM_EIGEN=TRUE
      shell: bash

    - name: Build
      run: |
        # Only avogadrolibs (and its dependencies) are needed for fuzzing, so
        # skip building avogadroapp.
        CC=clang CXX=clang++ cmake --build . --target avogadrolibs
      shell: bash
      working-directory: ${{ runner.workspace }}/build

    - name: Build fuzz targets
      run: |
        # ENABLE_FUZZ is not forwarded through the superbuild, so turn it on in
        # the avogadrolibs build itself.
        #
        # Asserts are kept alive here, which is the point of overriding the
        # per-config flags. CMake appends CMAKE_CXX_FLAGS_<CONFIG> after
        # CXXFLAGS, and RelWithDebInfo's end in -DNDEBUG -- so every assert()
        # in the tree disappears, including the ones that are the *only* guard
        # on an index. Two bugs found on 2026-09-20 (an undo command removing
        # an atom it never added, and Layer::addAtom writing a layer id no
        # layer had) sat behind asserts this job could not see. Dropping just
        # the NDEBUG keeps -O2, so fuzzing throughput is unchanged.
        #
        # Scoped to this directory deliberately: the third-party subprojects
        # the superbuild already built keep their own flags, so an assert in
        # Open Babel or spglib cannot fail a job about our parsers.
        #
        # Measured before turning this on: every target's seed corpus, and a
        # mutation soak over all 14 core, 8 io and 5 quantumio targets, run
        # clean with asserts enabled. Only qtgui/rwmolecule tripped one, and
        # that is fixed.
        cmake -DENABLE_FUZZ=ON \
          -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -g" \
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g" .
        cmake --build .
      shell: bash
      working-directory: ${{ runner.workspace }}/build/avogadrolibs

    - name: Run fuzz tests
      shell: bash
      working-directory: ${{ runner.workspace }}/build/avogadrolibs
      run: |
        set -uo pipefail

        export LLVM_SYMBOLIZER_PATH="$(command -v llvm-symbolizer)"
        export ASAN_OPTIONS="symbolize=1:detect_leaks=1:abort_on_error=1:color=always"
        export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"

        # One line per suite:
        #   suite | binary prefix | seed dir under $AVOGADRO_DATA_ROOT/data | targets
        # A target is either "name" -- seeds come from <seed dir>/name -- or
        # "name=subdir", when the target name and the data directory differ.
        # To fuzz a new class, add its name here and to the matching list in
        # tests/<suite>/CMakeLists.txt.
        suites=(
          "io|fuzz_||cjson cml sdf pdb xyz tmol=turbomole POSCAR=vasp OUTCAR=vasp smiles decompress=compressed compress-roundtrip=compressed"
          "quantumio|fuzz_||cube fchk molden orca qcjson=qcschema"
          "core|fuzz_core_|core|array bond coordinateblockgenerator crystal graph layer molecule neighbor residue ring secondarystructure utilities variant variantmap"
          "qtgui|fuzz_qtgui_|qtgui|rwmolecule generichighlighter jsonwidget interfacescript-json layermanager"
        )

        # Targets with known, pre-existing failures. They still run and still
        # upload artifacts, but they do not fail the job. Delete entries here as
        # the underlying bugs are fixed.
        known_issues=(
        )

        is_known_issue() {
          local entry
          for entry in "${known_issues[@]}"; do
            if [ "${entry}" = "$1" ]; then
              return 0
            fi
          done
          return 1
        }

        # -rss_limit_mb counts the whole process, not just what the target
        # allocates: the corpus libFuzzer holds in memory and every seed it
        # reads at startup are inside the number. quantumio/fchk is over the
        # 2048Mb default before it mutates anything -- its seeds total 143Mb
        # (c240.fchk alone is 35Mb) and the cached corpus another 63Mb, and an
        # ASan build peaks near 500Mb just reading c240 legitimately. That is
        # what the 2026-09-21 out-of-memory was: rss sat at 2228Mb from the
        # INITED line onward and never moved, and the artifact it named
        # replays on its own in 74Mb.
        #
        # So give that target headroom -- but pin -malloc_limit_mb, which
        # otherwise follows -rss_limit_mb and would quietly rise with it. A
        # single oversized allocation is the parser blowup this job exists to
        # catch, and it stays a failure.
        #
        # 128Mb, measured rather than guessed. The largest single allocation
        # any real seed makes is 35Mb -- libFuzzer's own buffer for c240.fchk,
        # the biggest of them; the parser itself stays under 32Mb on that
        # file. The bug this number has to catch is a density matrix sized
        # from a declared basis count, which reached 268Mb from a 376 byte
        # file before that was fixed. Anything much above 128Mb fails to see
        # it: a 512Mb cap was tried first and let it straight through.
        set_memory_limits() {
          case "$1" in
            quantumio/fchk)
              memory_limits=(-rss_limit_mb=4096 -malloc_limit_mb=128)
              ;;
            *)
              # libFuzzer's own defaults, spelled out so raising one of them
              # for a target cannot silently raise the other.
              memory_limits=(-rss_limit_mb=2048 -malloc_limit_mb=2048)
              ;;
          esac
        }

        artifact_root="${PWD}/fuzz-artifacts"
        corpus_root="${{ runner.workspace }}/fuzz-corpus"
        failures=0

        {
          echo "## Fuzz results (${FUZZ_SECONDS}s per target)"
          echo
          echo "| Target | Seeds | Corpus | Result |"
          echo "| --- | --- | --- | --- |"
        } >> "${GITHUB_STEP_SUMMARY}"

        for spec in "${suites[@]}"; do
          IFS='|' read -r suite prefix corpus_sub targets <<< "${spec}"

          for entry in ${targets}; do
            target="${entry%%=*}"
            seed_name="${entry##*=}"
            name="${suite}/${target}"
            binary="./bin/${prefix}${target}"
            artifact_dir="${artifact_root}/${suite}/${target}"
            corpus_dir="${corpus_root}/${suite}/${target}"
            mkdir -p "${artifact_dir}" "${corpus_dir}"

            if [ ! -x "${binary}" ]; then
              echo "::error::Fuzz binary ${binary} for ${name} was not built"
              echo "| ${name} | - | - | not built |" >> "${GITHUB_STEP_SUMMARY}"
              failures=1
              continue
            fi

            # Seeds live in the avogadrodata checkout. libFuzzer does not
            # recurse into subdirectories, so flatten the tree into one dir.
            seed_root="${AVOGADRO_DATA_ROOT}/data${corpus_sub:+/${corpus_sub}}/${seed_name}"
            seed_dir="${RUNNER_TEMP}/fuzz-seeds/${suite}/${target}"
            seed_args=()
            seed_count=0
            if [ -d "${seed_root}" ]; then
              rm -rf "${seed_dir}" && mkdir -p "${seed_dir}"
              while IFS= read -r -d '' f; do
                cp "${f}" "${seed_dir}/$(sha1sum "${f}" | cut -c1-40)"
              done < <(find "${seed_root}" -type f ! -name 'README*' -print0)
              seed_count=$(find "${seed_dir}" -type f | wc -l)
              [ "${seed_count}" -gt 0 ] && seed_args=("${seed_dir}")
            fi

            # libFuzzer writes newly discovered units to the *first* corpus
            # directory only, so the restored corpus grows and the seed
            # directory stays untouched.
            echo "::group::Fuzzing ${name}"
            # -timeout=30, not 10: the libraries carry SanitizerCoverage now
            # (see the ENABLE_FUZZ block in the top-level CMakeLists), and an
            # instrumented ASan build spends several seconds on work a release
            # build does in milliseconds -- perceiveBondOrders() on a 244-atom
            # nanotube, for one. A real hang still trips this comfortably.
            set_memory_limits "${name}"
            if "${binary}" -max_total_time="${FUZZ_SECONDS}" -timeout=30 \
                 "${memory_limits[@]}" \
                 -artifact_prefix="${artifact_dir}/" \
                 "${corpus_dir}" ${seed_args[@]+"${seed_args[@]}"} 2>&1 \
                 | tee "${artifact_dir}/run.log"; then
              result="pass"
            elif is_known_issue "${name}"; then
              result="known failure"
              echo "::warning::${name} failed (known issue, not failing the job)"
            else
              result="**FAIL**"
              echo "::error::${name} failed - see the fuzz-crashes artifact"
              failures=1
            fi
            echo "::endgroup::"

            # Minimize on the way out: rebuild the corpus as the smallest set
            # of units covering everything the corpus and seeds reach. Without
            # this the cached corpus grows without bound. The timeout is above
            # the fuzzing one so a unit that was fast enough to keep is not
            # dropped here.
            #
            # A merge only fails if replaying a stored unit crashes, times out
            # or runs out of memory, which means the cached corpus itself has
            # become poison: keeping it would wedge this target on every future
            # run, since libFuzzer replays the whole corpus at startup. The
            # corpus is a cache and the seeds are the source of truth, so throw
            # it away and rebuild from the seeds next time.
            merged_dir="${RUNNER_TEMP}/fuzz-merge/${suite}/${target}"
            rm -rf "${merged_dir}" && mkdir -p "${merged_dir}"
            if "${binary}" -merge=1 -timeout=25 "${memory_limits[@]}" \
                 "${merged_dir}" "${corpus_dir}" ${seed_args[@]+"${seed_args[@]}"} \
                 > "${artifact_dir}/merge.log" 2>&1 \
               && [ -n "$(ls -A "${merged_dir}")" ]; then
              rm -rf "${corpus_dir}"
              mv "${merged_dir}" "${corpus_dir}"
            else
              echo "::warning::${name} corpus merge failed, resetting the corpus"
              rm -rf "${merged_dir}" "${corpus_dir}"
              mkdir -p "${corpus_dir}"
            fi
            corpus_count=$(find "${corpus_dir}" -type f | wc -l)

            echo "| ${name} | ${seed_count} | ${corpus_count} | ${result} |" >> "${GITHUB_STEP_SUMMARY}"
          done
        done

        du -sh "${corpus_root}" || true

        exit "${failures}"

    # Saved even when a target crashed: the corpus built up to that point is
    # still worth keeping, and a rolling key means the next run restores the
    # most recent entry.
    - name: Save fuzz corpus
      if: ${{ always() && github.event_name != 'pull_request' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.workspace }}/fuzz-corpus
        key: fuzz-corpus-${{ github.run_id }}

    - name: Upload fuzz crash artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-crashes
        path: |
          ${{ runner.workspace }}/build/avogadrolibs/crash*
          ${{ runner.workspace }}/build/avogadrolibs/timeout*
          ${{ runner.workspace }}/build/avogadrolibs/leak*
          ${{ runner.workspace }}/build/avogadrolibs/fuzz-artifacts
        if-no-files-found: ignore
