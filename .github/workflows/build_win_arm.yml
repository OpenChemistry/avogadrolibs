name: Windows ARM Build
# Many thanks to Cristian Adam for examples
# e.g. https://github.com/cristianadam/HelloWorld/blob/master/.github/workflows/build_cmake.yml
# https://cristianadam.eu/20191222/using-github-actions-with-c-plus-plus-and-cmake/

# This workflow will build and (optionally) sign releases for Windows
# .. since SignPath requires only a Windows build in the action
# .. to successfully sign

on:
  push:
    # Bot branches get built by their pull_request event; building the push
    # too just doubles the jobs. The tags line is required: with only a
    # branch filter, tag pushes (release builds) would stop triggering.
    branches-ignore:
      - 'dependabot/**'
      - 'update-i18n-templates'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  # Not pinned to the 6.8.3 the x86_64 build uses: that pin exists because
  # newer Qt broke deployment on some Win10 x86 systems, which does not apply
  # to Windows on ARM.
  QT_VERSION: 6.10.1
  FEATURES: -DBUILD_GPL_PLUGINS=ON -DWITH_COORDGEN=OFF -DQT_VERSION=6 -DUSE_3DCONNEXION=OFF -DBUILD_MOLEQUEUE=OFF

# Never cancel a master run: a cancelled run never saves its compiler cache,
# and the slowest jobs, which gain the most from the cache, are exactly the
# ones a following merge would cancel. The group still allows only one running
# and one pending master run, so master runs queue one after another instead
# of stacking up, and release-asset uploads never overlap. PRs and other
# branches keep cancelling superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        # sccache: true turns on the compiler cache for an entry. It is only on
        # for the MSVC Release build, which passes no /Zi. The RelWithDebInfo
        # entry (the Sentry diagnostic build below) is left out on purpose:
        # /Zi writes every object's debug information into one shared PDB,
        # which sccache cannot cache, so those compiles would all miss.
        # Enabling it needs /Z7 (debug information embedded in each object),
        # for example with CMP0141 NEW and
        # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded.
        config:
        - {
            name: "Windows Qt6 ARM", artifact: "Win-ARM.exe",
            os: windows-11-arm,
            cc: "cl", cxx: "cl",
            build_type: "Release",
            sccache: true,
            cmake_flags: "-G Ninja -DCMAKE_TOOLCHAIN_FILE=/c/vcpkg/scripts/buildsystems/vcpkg.cmake -DUSE_SYSTEM_EIGEN=ON -DUSE_SYSTEM_LIBARCHIVE=ON -DUSE_SYSTEM_LIBXML2=ON -DUSE_SYSTEM_ZLIB=ON",
            build_flags: "--parallel",
            package: "Avogadro2",
            sentry: false,
          }

    steps: &build-steps
    - name: Checkout workflow repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Checkout Repositories
      uses: ./.github/actions/checkout-repositories

    # host and arch are left to the action: on an arm64 runner it picks the
    # windows_arm64 host and the native win64_msvc2022_arm64 build, rather
    # than the cross-compiled one whose host tools are x86_64.
    - name: Install Qt
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        cache: true
        version: ${{ env.QT_VERSION }}

    - name: Configure MSVC Command Prompt
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: arm64

    - name: Install vcpkg packages
      if: runner.os == 'Windows'
      uses: ./.github/actions/vcpkg-install
      with:
        packages: libarchive eigen3 libxml2 zlib

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install nsis ninja
      shell: bash

    # Must run before Configure: it exports the compiler-launcher variables
    # that the superbuild's subprojects read when they configure.
    - name: Restore compiler cache
      if: matrix.config.sccache
      uses: ./.github/actions/compiler-cache
      with:
        mode: restore
        name: ${{ matrix.config.name }}
        size: ${{ matrix.config.sccache_size || '600M' }}

    - name: Configure
      run: |
        if [ ! -d "${{ runner.workspace }}/build" ]; then mkdir "${{ runner.workspace }}/build"; fi
        cd "${{ runner.workspace }}/build"
        SENTRY_ARGS=""
        if [ "${USE_SENTRY}" = "true" ]; then
          # An unset SENTRY_DSN secret is fine: the build then reports itself
          # as unavailable at runtime rather than failing to configure.
          SENTRY_ARGS="-DUSE_SENTRY=ON -DSENTRY_DSN=${SENTRY_DSN} -DSENTRY_ENVIRONMENT=nightly"
        fi
        CC=${{matrix.config.cc}} CXX=${{matrix.config.cxx}} cmake $GITHUB_WORKSPACE/openchemistry ${{env.FEATURES}} ${{ startsWith(github.ref, 'refs/tags/') && '-DAVOGADRO_RELEASE_BUILD=ON' || '' }} -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} ${{matrix.config.cmake_flags}} $SENTRY_ARGS
      shell: bash
      env:
        USE_SENTRY: ${{ matrix.config.sentry }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    # Cache thirdparty builds (OpenBabel, etc.)
    - name: Cache thirdparty
      id: thirdparty-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.workspace }}/build/Downloads
        key: thirdparty-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config.build_type }}-sentry${{ matrix.config.sentry }}-${{ hashFiles('openchemistry/cmake/External*.cmake', 'openchemistry/cmake/projects/*.cmake') }}

    - name: Build
      run: |
        CC=${{matrix.config.cc}} CXX=${{matrix.config.cxx}} cmake --build . --config ${{matrix.config.build_type}} ${{matrix.config.build_flags}}
      shell: bash
      working-directory: ${{ runner.workspace }}/build

    # Saved from master only, for the reason given in the vcpkg-install action.
    - name: Save thirdparty cache
      if: steps.thirdparty-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.workspace }}/build/Downloads
        key: ${{ steps.thirdparty-cache.outputs.cache-primary-key }}

    # This job has no test step, so the cache is saved right after the build.
    # !cancelled() lets the action run after a failed build. The action prints
    # its statistics on every run and saves only on master, failures
    # included: sccache entries are content-addressed, so a partial cache is
    # still correct.
    - name: Save compiler cache
      if: matrix.config.sccache && !cancelled()
      uses: ./.github/actions/compiler-cache
      with:
        mode: save
        name: ${{ matrix.config.name }}
        size: ${{ matrix.config.sccache_size || '600M' }}

    # The crashpad binaries reach the prefix through crashpad's own install
    # rules, which sentry-native does not drive directly when building shared.
    # If they go missing the application still starts and simply never reports
    # a crash, so fail here rather than shipping that.
    - name: Verify crash handler binaries
      if: matrix.config.sentry
      shell: bash
      working-directory: ${{ runner.workspace }}/build
      run: |
        status=0
        for binary in avogadro2.exe sentry.dll crashpad_handler.exe crashpad_wer.dll; do
          if [ -f "prefix/bin/$binary" ]; then
            echo "found    prefix/bin/$binary"
          else
            echo "MISSING  prefix/bin/$binary"
            status=1
          fi
        done
        echo "--- debug symbols found ---"
        find . -name '*.pdb' -not -path './Downloads/*' | head -40
        exit $status

    # Runs before packaging, which moves prefix/ out from under us. Sentry
    # matches minidumps to symbols by debug ID, so this does not have to agree
    # with the release name the application reports. Both avogadrolibs and
    # avogadroapp symbols are needed: crashes usually land in a plugin or in
    # Avogadro::Rendering rather than in avogadro2.exe itself.
    - name: Upload debug symbols
      if: matrix.config.sentry
      shell: bash
      working-directory: ${{ runner.workspace }}/build
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        # Pinned rather than "latest", to match how this workflow pins every
        # action to a SHA. The checksum is of the released aarch64 binary, so
        # it differs from the one the x86_64 workflow checks.
        SENTRY_CLI_VERSION: "3.6.2"
        SENTRY_CLI_SHA256: "93ee7916c05c113a35daccf107c034af96f279561c103aa832668e4eecca3fb4"
      run: |
        if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
          echo "SENTRY_AUTH_TOKEN is not set - skipping debug symbol upload."
          echo "The diagnostic build is still produced; crashes just will not"
          echo "symbolicate until the secret is configured."
          exit 0
        fi
        curl -sSfL -o sentry-cli.exe \
          "https://downloads.sentry-cdn.com/sentry-cli/${SENTRY_CLI_VERSION}/sentry-cli-Windows-aarch64.exe"
        echo "${SENTRY_CLI_SHA256}  sentry-cli.exe" | sha256sum --check --strict
        ./sentry-cli.exe debug-files upload --include-sources \
          avogadroapp avogadrolibs prefix/bin

    - name: Create Windows Packages
      if: matrix.config.artifact != 0
      shell: bash
      run: |
        gh release download -R prefix-dev/pixi -p "pixi-aarch64-pc-windows-msvc.exe"
        # wget https://github.com/prefix-dev/pixi/releases/latest/download/pixi-aarch64-pc-windows-msvc.exe
        # move pixi to prefix/bin
        mv pixi-aarch64-pc-windows-msvc.exe prefix/bin/pixi.exe
        # run windeployqt
        windeployqt --release prefix/bin/avogadro2.exe
        # Copy Qt DLLs that windeployqt misses (used by plugins and JKQTPlotter)
        cp "${QT_ROOT_DIR}/bin/Qt6Concurrent.dll" prefix/bin/
        cp "${QT_ROOT_DIR}/bin/Qt6PrintSupport.dll" prefix/bin/
        cp "${QT_ROOT_DIR}/bin/Qt6Xml.dll" prefix/bin/
        mv prefix avogadro2
        # 7z a Avogadro2-windows.zip avogadro2
        cd avogadro2
        # create NSIS
        /c/Program\ Files\ \(x86\)/NSIS/makensis avogadro2.nsi
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # This is a tag - extract version
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present
        else
          # This is a nightly build - use current date
          VERSION="continuous"
        fi

        # NSIS OutFile is "<package>-Setup.exe", set from NSIS_OUTFILE in
        # avogadroapp/avogadro/CMakeLists.txt, so these two names have to stay
        # in step.
        mv ${{matrix.config.package}}-Setup.exe ../${{matrix.config.package}}-${VERSION}-win-arm.exe
      working-directory: ${{ runner.workspace }}/build/
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Upload
      if: matrix.config.artifact != 0
      id: upload-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ runner.workspace }}/build/Avogadro2*.*
        name: ${{ matrix.config.artifact }}

    - name: Upload release assets
      if: matrix.config.artifact != 0 && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')
      uses: ./.github/actions/upload-release
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        artifacts: "${{ runner.workspace }}/build/Avogadro2*.*"

    - name: Sign Windows release
      if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')
      uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
      continue-on-error: true
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '${{ secrets.SIGNPATH_ORG_ID }}'
        project-slug: 'avogadrolibs'
        signing-policy-slug: 'release-signing'
        github-artifact-id: '${{ steps.upload-artifact.outputs.artifact-id }}'
        wait-for-completion: false
        output-artifact-directory: '../build/'

    # MSIX is release-only: the diagnostic build installs beside a release
    # install and has no Store identity of its own. Named for the architecture
    # so it is not confused with the x86_64 workflow's Avogadro2.msix.
    - name: Create MSIX
      if: ${{ !matrix.config.sentry && github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/') }}
      shell: powershell
      run:
        # create MSIX
        makeappx pack /v /d . /p ../Avogadro2-arm64.msix
      working-directory: ${{ runner.workspace }}/build/avogadro2
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Upload MSIX
      if: ${{ !matrix.config.sentry && github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ runner.workspace }}/build/Avogadro2-arm64.msix
        name: Avogadro2-arm64.msix

    - name: Setup tmate session
      if: failure()
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
      timeout-minutes: 60

  # Diagnostic (Sentry) builds skip PRs to save runners: they only run on
  # pushes, releases and manual dispatches, or on a PR that has been labeled
  # full-ci. Label a PR full-ci and push to it to include this job; fork push
  # builds still run it, since a fork push is not a pull_request event here.
  # The steps are shared with "build" through the &build-steps/*build-steps
  # YAML anchor, so edit them there, not here.
  diagnostic:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        config:
        # No sccache here: RelWithDebInfo compiles with /Zi (see the note on
        # the build job's matrix).
        # Diagnostic build with Sentry crash reporting compiled in. Ships as a
        # separate installer that installs beside a release install; the
        # release build above gets no crash reporting.
        # RelWithDebInfo rather than Release: MSVC Release passes no /Zi, so it
        # emits no PDBs and every frame would come back as a raw address.
        - {
            name: "Windows Qt6 ARM (Sentry)", artifact: "Win-ARM-diagnostic.exe",
            os: windows-11-arm,
            cc: "cl", cxx: "cl",
            build_type: "RelWithDebInfo",
            cmake_flags: "-G Ninja -DCMAKE_TOOLCHAIN_FILE=/c/vcpkg/scripts/buildsystems/vcpkg.cmake -DUSE_SYSTEM_EIGEN=ON -DUSE_SYSTEM_LIBARCHIVE=ON -DUSE_SYSTEM_LIBXML2=ON -DUSE_SYSTEM_ZLIB=ON",
            build_flags: "--parallel",
            package: "Avogadro2-Diagnostic",
            sentry: true,
          }

    steps: *build-steps
